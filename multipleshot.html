<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student & Teacher Registration System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }
        .form-section, .list-section {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 25px;
            border-bottom: 3px solid #e0e0e0;
        }
        .tab-btn {
            padding: 12px 25px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 4px solid transparent;
            transition: all 0.3s;
            color: #888;
        }
        .tab-btn:hover {
            color: #667eea;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
            background: #f8f9ff;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        button:active {
            transform: translateY(0);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .reset-btn {
            background: #95a5a6;
        }
        .reset-btn:hover {
            background: #7f8c8d;
        }
        .search-section {
            margin-bottom: 20px;
            padding: 18px;
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f4f8 100%);
            border-radius: 10px;
        }
        .search-group {
            display: grid;
            grid-template-columns: 1fr 1fr 100px;
            gap: 10px;
        }
        .user-list {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .user-list::-webkit-scrollbar {
            width: 6px;
        }
        .user-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .user-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        .user-card {
            border: 2px solid #e0e0e0;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .user-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .user-card:hover {
            border-color: #667eea;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
            transform: translateX(5px);
        }
        .user-card:hover::before {
            opacity: 1;
        }
        .user-info {
            flex: 1;
        }
        .user-info p {
            margin: 6px 0;
            color: #555;
            font-size: 14px;
        }
        .user-card strong {
            color: #667eea;
            font-size: 16px;
            display: block;
            margin-bottom: 8px;
        }
        .user-meta {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #666;
            background: #f0f3ff;
            padding: 5px 12px;
            border-radius: 6px;
        }
        .delete-btn {
            background: #e74c3c;
            padding: 8px 12px;
            font-size: 12px;
            margin-left: 10px;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
            flex-shrink: 0;
        }
        .delete-btn:hover {
            background: #c0392b;
        }
        .success-msg {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        .error-msg {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .stat-card h3 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .stat-card p {
            font-size: 13px;
            opacity: 0.95;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .search-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Registration System</h1>
            <p>Student & Teacher Management Portal</p>
        </div>

        <div class="main-content">
            <!-- Registration Form Section -->
            <div class="form-section">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('student-form')">👨‍🎓 Student</button>
                    <button class="tab-btn" onclick="switchTab('teacher-form')">👨‍🏫 Teacher</button>
                </div>

                <!-- Student Registration -->
                <div id="student-form" class="tab-content active">
                    <div class="success-msg" id="student-success">✓ Student registered successfully!</div>
                    <div class="error-msg" id="student-error"></div>
                    <form onsubmit="registerStudent(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="studentName" placeholder="Enter full name" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="studentEmail" placeholder="student@example.com" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="studentPassword" placeholder="Enter password" required>
                            </div>
                            <div class="form-group">
                                <label>Roll Number</label>
                                <input type="text" id="rollNumber" placeholder="e.g., STU001" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Class/Grade</label>
                                <select id="studentClass" required>
                                    <option value="">Select Class</option>
                                    <option value="10th">10th</option>
                                    <option value="11th">11th</option>
                                    <option value="12th">12th</option>
                                    <option value="B.Tech">B.Tech</option>
                                    <option value="M.Tech">M.Tech</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" id="studentPhone" placeholder="9876543210">
                            </div>
                        </div>
                        <div class="button-group">
                            <button type="submit">Register Student</button>
                            <button type="reset" class="reset-btn">Clear</button>
                        </div>
                    </form>
                </div>

                <!-- Teacher Registration -->
                <div id="teacher-form" class="tab-content">
                    <div class="success-msg" id="teacher-success">✓ Teacher registered successfully!</div>
                    <div class="error-msg" id="teacher-error"></div>
                    <form onsubmit="registerTeacher(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="teacherName" placeholder="Enter full name" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="teacherEmail" placeholder="teacher@example.com" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="teacherPassword" placeholder="Enter password" required>
                            </div>
                            <div class="form-group">
                                <label>Employee ID</label>
                                <input type="text" id="employeeId" placeholder="e.g., EMP001" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Subject</label>
                                <select id="subject" required>
                                    <option value="">Select Subject</option>
                                    <option value="Mathematics">Mathematics</option>
                                    <option value="Physics">Physics</option>
                                    <option value="Chemistry">Chemistry</option>
                                    <option value="English">English</option>
                                    <option value="History">History</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" id="teacherPhone" placeholder="9876543210">
                            </div>
                        </div>
                        <div class="button-group">
                            <button type="submit">Register Teacher</button>
                            <button type="reset" class="reset-btn">Clear</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- View & Search Section -->
            <div class="list-section">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchListTab('student-list')">👨‍🎓 Students</button>
                    <button class="tab-btn" onclick="switchListTab('teacher-list')">👨‍🏫 Teachers</button>
                </div>

                <!-- Student List -->
                <div id="student-list" class="tab-content active">
                    <div class="stats">
                        <div class="stat-card">
                            <h3 id="studentCount">0</h3>
                            <p>Total Students</p>
                        </div>
                    </div>
                    <div class="search-section">
                        <div class="search-group">
                            <input type="text" id="studentSearch" placeholder="Search by name or email" onkeyup="filterStudents()">
                            <select id="studentClassFilter" onchange="filterStudents()">
                                <option value="">All Classes</option>
                                <option value="10th">10th</option>
                                <option value="11th">11th</option>
                                <option value="12th">12th</option>
                                <option value="B.Tech">B.Tech</option>
                                <option value="M.Tech">M.Tech</option>
                            </select>
                            <button onclick="filterStudents()">🔍 Search</button>
                        </div>
                    </div>
                    <div class="user-list" id="studentListContainer"></div>
                </div>

                <!-- Teacher List -->
                <div id="teacher-list" class="tab-content">
                    <div class="stats">
                        <div class="stat-card">
                            <h3 id="teacherCount">0</h3>
                            <p>Total Teachers</p>
                        </div>
                    </div>
                    <div class="search-section">
                        <div class="search-group">
                            <input type="text" id="teacherSearch" placeholder="Search by name or email" onkeyup="filterTeachers()">
                            <select id="subjectFilter" onchange="filterTeachers()">
                                <option value="">All Subjects</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="Physics">Physics</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="English">English</option>
                                <option value="History">History</option>
                            </select>
                            <button onclick="filterTeachers()">🔍 Search</button>
                        </div>
                    </div>
                    <div class="user-list" id="teacherListContainer"></div>
                    <!-- Also show students in teacher view -->
                    <h3 style="margin-top:20px; margin-bottom:10px; color:#333">Students (also shown here)</h3>
                    <div class="user-list" id="studentListInTeacherView"></div>
                </div>
            </div>
        </div>
    </div>

        // Data storage
        let students = JSON.parse(localStorage.getItem('students')) || dummyStudents;
        let teachers = JSON.parse(localStorage.getItem('teachers')) || dummyTeachers;

        // Initialize storage
        if (!localStorage.getItem('students')) localStorage.setItem('students', JSON.stringify(dummyStudents));
        if (!localStorage.getItem('teachers')) localStorage.setItem('teachers', JSON.stringify(dummyTeachers));

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.form-section .tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.form-section .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function switchListTab(tabName) {
            document.querySelectorAll('.list-section .tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.list-section .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if(tabName === 'student-list') displayStudents();
            else displayTeachers();
        }

        // Register Student
        function registerStudent(event) {
            event.preventDefault();
            const student = {
                id: Date.now(),
                name: document.getElementById('studentName').value,
                email: document.getElementById('studentEmail').value,
                password: document.getElementById('studentPassword').value,
                rollNumber: document.getElementById('rollNumber').value,
                class: document.getElementById('studentClass').value,
                phone: document.getElementById('studentPhone').value
            };
            
            if(students.find(s => s.email === student.email)) {
                document.getElementById('student-error').textContent = '❌ Email already registered!';
                document.getElementById('student-error').style.display = 'block';
                setTimeout(() => document.getElementById('student-error').style.display = 'none', 4000);
                return;
            }
            
            students.push(student);
            localStorage.setItem('students', JSON.stringify(students));
            document.querySelector('#student-form form').reset();
            document.getElementById('student-success').style.display = 'block';
            setTimeout(() => document.getElementById('student-success').style.display = 'none', 3000);
            displayStudents();
        }

        // Register Teacher
        function registerTeacher(event) {
            event.preventDefault();
            const teacher = {
                id: Date.now(),
                name: document.getElementById('teacherName').value,
                email: document.getElementById('teacherEmail').value,
                password: document.getElementById('teacherPassword').value,
                subject: document.getElementById('subject').value,
                employeeId: document.getElementById('employeeId').value,
                phone: document.getElementById('teacherPhone').value
            };
            
            if(teachers.find(t => t.email === teacher.email)) {
                document.getElementById('teacher-error').textContent = '❌ Email already registered!';
                document.getElementById('teacher-error').style.display = 'block';
                setTimeout(() => document.getElementById('teacher-error').style.display = 'none', 4000);
                return;
            }
            
            teachers.push(teacher);
            localStorage.setItem('teachers', JSON.stringify(teachers));
            document.querySelector('#teacher-form form').reset();
            document.getElementById('teacher-success').style.display = 'block';
            setTimeout(() => document.getElementById('teacher-success').style.display = 'none', 3000);
            displayTeachers();
        }

        // Display Students
        function displayStudents() {
            const container = document.getElementById('studentListContainer');
            document.getElementById('studentCount').textContent = students.length;
            container.innerHTML = students.length ? students.map(s => `
                <div class="user-card">
                    <div class="user-info">
                        <strong>${s.name}</strong>
                        <p>📧 ${s.email}</p>
                        <div class="user-meta">
                            <span class="meta-item">🎓 Roll: ${s.rollNumber}</span>
                            <span class="meta-item">📚 ${s.class}</span>
                            <span class="meta-item">📱 ${s.phone || 'N/A'}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteStudent(${s.id})">Delete</button>
                </div>
            `).join('') : `<div class="empty-state"><div class="empty-state-icon">📭</div><p>No students registered yet.</p></div>`;
        }

        // Display Teachers
        function displayTeachers() {
            const container = document.getElementById('teacherListContainer');
            document.getElementById('teacherCount').textContent = teachers.length;
            container.innerHTML = teachers.length ? teachers.map(t => `
                <div class="user-card">
                    <div class="user-info">
                        <strong>${t.name}</strong>
                        <p>📧 ${t.email}</p>
                        <div class="user-meta">
                            <span class="meta-item">🏢 ID: ${t.employeeId}</span>
                            <span class="meta-item">📖 ${t.subject}</span>
                            <span class="meta-item">📱 ${t.phone || 'N/A'}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteTeacher(${t.id})">Delete</button>
                </div>
            `).join('') : `<div class="empty-state"><div class="empty-state-icon">📭</div><p>No teachers registered yet.</p></div>`;
        }

        // Filter Students
        function filterStudents() {
            const searchTerm = document.getElementById('studentSearch').value.toLowerCase();
            const classFilter = document.getElementById('studentClassFilter').value;
            
            const filtered = students.filter(s => 
                (s.name.toLowerCase().includes(searchTerm) || s.email.toLowerCase().includes(searchTerm)) &&
                (classFilter === '' || s.class === classFilter)
            );
            
            const container = document.getElementById('studentListContainer');
            container.innerHTML = filtered.length ? filtered.map(s => `
                <div class="user-card">
                    <div class="user-info">
                        <strong>${s.name}</strong>
                        <p>📧 ${s.email}</p>
                        <div class="user-meta">
                            <span class="meta-item">🎓 Roll: ${s.rollNumber}</span>
                            <span class="meta-item">📚 ${s.class}</span>
                            <span class="meta-item">📱 ${s.phone || 'N/A'}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteStudent(${s.id})">Delete</button>
                </div>
            `).join('') : `<div class="empty-state"><div class="empty-state-icon">🔍</div><p>No students found.</p></div>`;
        }

        // Filter Teachers
        function filterTeachers() {
            const searchTerm = document.getElementById('teacherSearch').value.toLowerCase();
            const subjectFilter = document.getElementById('subjectFilter').value;
            
            const filtered = teachers.filter(t => 
                (t.name.toLowerCase().includes(searchTerm) || t.email.toLowerCase().includes(searchTerm)) &&
                (subjectFilter === '' || t.subject === subjectFilter)
            );
            
            const container = document.getElementById('teacherListContainer');
            container.innerHTML = filtered.length ? filtered.map(t => `
                <div class="user-card">
                    <div class="user-info">
                        <strong>${t.name}</strong>
                        <p>📧 ${t.email}</p>
                        <div class="user-meta">
                            <span class="meta-item">🏢 ID: ${t.employeeId}</span>
                            <span class="meta-item">📖 ${t.subject}</span>
                            <span class="meta-item">📱 ${t.phone || 'N/A'}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteTeacher(${t.id})">Delete</button>
                </div>
            `).join('') : `<div class="empty-state"><div class="empty-state-icon">🔍</div><p>No teachers found.</p></div>`;
        }

        // Delete Student
        function deleteStudent(id) {
            if(confirm('Are you sure you want to delete this student?')) {
                students = students.filter(s => s.id !== id);
                localStorage.setItem('students', JSON.stringify(students));
                displayStudents();
            }
        }

        // Delete Teacher
        function deleteTeacher(id) {
            if(confirm('Are you sure you want to delete this teacher?')) {
                teachers = teachers.filter(t => t.id !== id);
                localStorage.setItem('teachers', JSON.stringify(teachers));
                displayTeachers();
            }
        }

        // Initial display
        displayStudents();
        displayTeachers();
    </script>
</body>
</html>
